[build-system]
requires = ["maturin==1.9.6"]
build-backend = "maturin"

[project]
name = "hydro-craft"
version = "0.3.0"
requires-python = ">=3.10"
description = "Python API for a Rust hydrology evaluator: synthetic HBV-style daily catchment and one-reservoir release rules for optimization studies"
keywords = ["hydrology", "HBV model", "rainfall-runoff", "reservoir operation", "water resources", "simulation", "optimization", "Rust"]

[project.urls]
Repository = "https://github.com/dietmarwo/hydro-craft"

[tool.maturin]
module-name = "hydro_craft._native"
python-source = "python"
features = ["python"]
include = [
  { path = "models/*.json", format = "sdist" },
  { path = "docs/*.md", format = "sdist" },
  { path = "validation/*.py", format = "sdist" },
]
