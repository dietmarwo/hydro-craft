[package]
name = "hydro-craft"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
description = "Hydrology evaluator: synthetic HBV-style daily catchment and one-reservoir release rules, with a versioned JSON CLI for optimization studies"
license = "MIT"
repository = "https://github.com/dietmarwo/hydro-craft"
keywords = ["hydrology", "hbv", "rainfall-runoff", "reservoir", "simulation"]
categories = ["science::geo", "simulation"]
# Release artifacts and patch series ship in the ZIP, not in the crate or sdist.
exclude = ["/packages/", "/patches/", "/dist/", "/SHA256SUMS", "/docs/images/"]

[lib]
crate-type = ["rlib", "cdylib"]

[features]
python = ["dep:pyo3", "pyo3/extension-module"]
# Exposes Prepared::profile_json for examples/breakdown.rs.
profiling = []

[[example]]
name = "breakdown"
required-features = ["profiling"]

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["raw_value", "float_roundtrip"] }
sha2 = "=0.10.9"
pyo3 = { version = "=0.29.0", optional = true, features = ["abi3-py310"] }
